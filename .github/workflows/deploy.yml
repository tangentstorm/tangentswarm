name: Deploy swarm-tmux

# Redeploys the swarm-tmux MCP server on the deploy host on every push to main
# (or a manual run). The SSH key is forced to run /usr/local/sbin/swarm-tmux-deploy as the service user;
# the only thing sent is the commit SHA, which the server script only logs.
# The server-side deploy script and key restriction are host config kept outside this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-tmux-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH (forced command)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}" && test -n "${DEPLOY_USER:-}"
          test -n "${DEPLOY_SSH_KEY:-}" && test -n "${DEPLOY_KNOWN_HOSTS:-}"
          d="$RUNNER_TEMP/ssh"
          (umask 077 && mkdir -p "$d" && printf '%s\n' "$DEPLOY_SSH_KEY" > "$d/key" \
             && printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$d/known_hosts")
          trap 'rm -rf "$d"' EXIT
          ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
